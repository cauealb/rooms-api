
services:
  rooms-api:
    image: bitnami/postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: 1234
      POSTGRESQL_DATABASE: rooms-api

  rooms-api-test:
    image: bitnami/postgresql
    ports:
      - "5433:5432"
    environment:
      POSTGRESQL_USERNAME: admin
      POSTGRESQL_PASSWORD: 1234
      POSTGRESQL_DATABASE: rooms-api-test
    tmpfs:
      - /bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rooms-api-test"]
      interval: 5s
      timeout: 5s
      retries: 12
